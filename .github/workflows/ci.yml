name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
          python-version: "3.12"
      - run: uv sync --frozen
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: mypy
        run: uv run mypy

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: firm_radar
          POSTGRES_PASSWORD: firm_radar
          POSTGRES_DB: firm_radar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U firm_radar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FIRM_RADAR_TEST_DATABASE_URL: postgresql+asyncpg://firm_radar:firm_radar@localhost:5432/firm_radar_test
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Migrations apply cleanly
        env:
          FIRM_RADAR_DATABASE_URL: ${{ env.FIRM_RADAR_TEST_DATABASE_URL }}
        run: uv run alembic upgrade head && uv run alembic downgrade base
      - name: pytest (no network)
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -t firm-radar:ci .
