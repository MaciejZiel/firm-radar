# nginx server block for the firm-radar demo. Include it from nginx.conf (http context).
# The Cloudflare tunnel hostname must point at this listener (http://127.0.0.1:8080).
# Replace the server_name with the hostname added to the tunnel.

server {
    listen 127.0.0.1:8080;
    server_name firm-radar.example.com;

    # The app is read-only; nothing legitimate sends a large body.
    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Cloudflare passes the visitor address in CF-Connecting-IP. The app rate-limits per
        # client address and trusts X-Forwarded-For only from 127.0.0.1. If a request arrives
        # without CF-Connecting-IP (for example straight to this listener), nginx sends no
        # X-Forwarded-For, so the app sees 127.0.0.1 and those requests share one budget.
        # A client-supplied X-Forwarded-For is always overwritten here, never passed on.
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        # The tunnel always terminates TLS, so the scheme is fixed rather than copied.
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8093;
        proxy_set_header Host $host;
        expires 7d;
    }
}
